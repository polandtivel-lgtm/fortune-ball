<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Fortune Ball Stats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet" />
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #1d0b2e 0%, #09040f 75%);
      font-family: "Cinzel", Georgia, serif;
      color: #fff4d6;
    }
    .card {
      text-align: center;
      padding: 2em 3em;
      border-radius: 16px;
      background: rgba(20, 8, 32, 0.6);
      box-shadow: 0 0 40px #8a4dff66;
    }
    h1 {
      margin: 0 0 0.3em;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      color: #c9a7ff;
    }
    .count {
      font-size: 3.5rem;
      font-weight: 700;
      text-shadow: 0 0 10px #ffe9a8, 0 0 24px #ffd77a;
    }
    .error {
      color: #ff9ab5;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Crystal Ball Clicks</h1>
    <div id="result" class="count">...</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const key = params.get("key");
    const resultEl = document.getElementById("result");

    if (!key) {
      resultEl.textContent = "Add ?key=... to the URL";
      resultEl.classList.add("error");
    } else {
      fetch(`/api/stats?key=${encodeURIComponent(key)}`)
        .then((r) => r.json().then((data) => ({ ok: r.ok, data })))
        .then(({ ok, data }) => {
          if (!ok) {
            resultEl.textContent = data.error || "Not authorized";
            resultEl.classList.add("error");
            return;
          }
          resultEl.textContent = data.total;
        })
        .catch(() => {
          resultEl.textContent = "Could not load";
          resultEl.classList.add("error");
        });
    }
  </script>
</body>
</html>
